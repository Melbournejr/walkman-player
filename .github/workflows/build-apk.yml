name: Build & Release Walkman APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Walkman Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Walkman-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Extract Version from build.gradle.kts
        id: extract_ver
        run: |
          VER=$(grep 'val walkmanVersion =' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release for OTA Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_ver.outputs.version }}
          name: Walkman ${{ steps.extract_ver.outputs.version }}
          body: |
            ### Walkman ${{ steps.extract_ver.outputs.version }} OTA Release
            - Cơ học cuộn băng Cassette 3D thực tế (bảo toàn diện tích cuộn băng Trái/Phải & dây băng chạy tiếp tuyến qua đầu từ).
            - Tích hợp trình cập nhật trực tuyến OTA qua GitHub Releases.
            - Bộ giải mã DSD 1024-Tap Symmetric Kaiser FIR (-140dB).
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
