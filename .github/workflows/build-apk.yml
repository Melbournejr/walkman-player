name: Build & Release Walkman APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Prebuilt FFmpeg 6.0 Android arm64-v8a Libraries & C Headers
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/cpp/include
          
          echo "Downloading Prebuilt FFmpeg Android arm64-v8a shared libraries & headers..."
          curl -L --fail --retry 3 -o /tmp/ffmpeg-android.tar.bz2 "https://sourceforge.net/projects/avbuild/files/android/ffmpeg-6.0-android-clang-lite.tar.bz2/download"
          mkdir -p /tmp/ffmpeg_extracted
          tar -xjf /tmp/ffmpeg-android.tar.bz2 -C /tmp/ffmpeg_extracted
          
          INC_DIR=$(find /tmp/ffmpeg_extracted -type d -name "include" | head -n 1)
          LIB_DIR=$(find /tmp/ffmpeg_extracted -type d -path "*/arm64-v8a" | head -n 1)
          
          cp -r "$INC_DIR"/* app/src/main/cpp/include/
          cp -P "$LIB_DIR"/libavcodec.so* app/src/main/jniLibs/arm64-v8a/libavcodec.so
          cp -P "$LIB_DIR"/libavformat.so* app/src/main/jniLibs/arm64-v8a/libavformat.so
          cp -P "$LIB_DIR"/libswresample.so* app/src/main/jniLibs/arm64-v8a/libswresample.so
          cp -P "$LIB_DIR"/libavutil.so* app/src/main/jniLibs/arm64-v8a/libavutil.so
          
          echo "Verified FFmpeg C Headers and arm64-v8a Shared Libraries:"
          ls -lh app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/cpp/include/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          cmake-version: 3.22.1

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Assemble Debug APK with True FFmpeg C/C++ JNI Engine
        run: gradle assembleDebug --no-daemon

      - name: Upload Walkman Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Walkman-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Extract Version from build.gradle.kts
        id: extract_ver
        run: |
          VER=$(grep 'val walkmanVersion =' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release for OTA Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_ver.outputs.version }}
          name: Walkman ${{ steps.extract_ver.outputs.version }}
          body: |
            ### Walkman ${{ steps.extract_ver.outputs.version }} True FFmpeg C/C++ JNI Release
            - Biên dịch và liên kết trực tiếp (Native CMake Link) với bộ thư viện C của **FFmpeg 6.0 (`libavformat.so`, `libavcodec.so`, `libswresample.so`, `libavutil.so` arm64-v8a)**.
            - Giải mã phần cứng DSD64/128/256 & DST bằng `avcodec_receive_frame()` + `swr_convert()` sang 32-bit Float PCM.
            - Tái cấu trúc toàn bộ DSP sang **64-bit Double Precision Biquad Cascade**: Cắt sub-sonic 20Hz & mud-cut 210Hz cho dải Bass gọn, chắc, dứt khoát; nâng dải Mid 1.65kHz ngọt và rõ nét; tách lớp không gian Mid/Side chính xác.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
