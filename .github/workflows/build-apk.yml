name: Build & Release Walkman APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Prebuilt FFmpeg Audio Native AAR (arm64-v8a)
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/ffmpeg-kit-audio.aar "https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0-2.LTS/ffmpeg-kit-audio-6.0-2.LTS.aar" || rm -f app/libs/ffmpeg-kit-audio.aar
          ls -lh app/libs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Walkman Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Walkman-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Extract Version from build.gradle.kts
        id: extract_ver
        run: |
          VER=$(grep 'val walkmanVersion =' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release for OTA Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_ver.outputs.version }}
          name: Walkman ${{ steps.extract_ver.outputs.version }}
          body: |
            ### Walkman ${{ steps.extract_ver.outputs.version }} OTA Release
            - Tích hợp Prebuilt FFmpeg Native DSD Decoder (`libavcodec`/`libavformat` `arm64-v8a`) qua Dynamic Reflection Bridge + 2048-Tap Kaiser Ultra-Linear Phase (-150dB) + 6th-Order Ultrasonic Cascade.
            - Bố cục dải nút Vector 3D hàng ngang dưới Cassette khi xoay ngang màn hình.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
