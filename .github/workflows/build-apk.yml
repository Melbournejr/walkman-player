name: Build Walkman APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the APK artifact using the existing key
        type: boolean
        default: false
      publish:
        description: Publish a GitHub Release for the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate release request
        id: prepare
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^val walkmanVersion = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' app/build.gradle.kts)
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "::error title=Invalid APK version::Expected one numeric walkmanVersion in app/build.gradle.kts."
            exit 1
          fi
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]] || [[ "$MANUAL_PUBLISH" == true ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
              echo "::error title=Version tag required::Publish requires the v$version tag. Selected ref is $GITHUB_REF. For a signed APK artifact, run with sign=true and publish=false."
              exit 1
            fi
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sign=false
          if [[ "$publish" == true || "$MANUAL_SIGN" == true ]]; then
            sign=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sign=$sign" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android SDK components
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - uses: actions/cache@v5
        id: ffmpeg
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/cpp/include
          key: android-ffmpeg-arm64-r26b-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125" scripts/build-ffmpeg-android.sh

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.4'

      - name: Run tests and lint
        run: gradle testReleaseUnitTest lintRelease --no-daemon

      - name: Assemble unsigned release APK
        if: steps.prepare.outputs.sign != 'true'
        run: gradle assembleRelease --no-daemon

      - name: Assemble and verify signed release APK
        if: steps.prepare.outputs.sign == 'true'
        env:
          WALKMAN_KEYSTORE_BASE64: ${{ secrets.WALKMAN_KEYSTORE_BASE64 }}
          WALKMAN_STORE_PASSWORD: ${{ secrets.WALKMAN_STORE_PASSWORD }}
          WALKMAN_KEY_ALIAS: ${{ secrets.WALKMAN_KEY_ALIAS }}
          WALKMAN_KEY_PASSWORD: ${{ secrets.WALKMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WALKMAN_KEYSTORE_BASE64:?Configure the WALKMAN_KEYSTORE_BASE64 Actions secret}"
          : "${WALKMAN_STORE_PASSWORD:?Configure the WALKMAN_STORE_PASSWORD Actions secret}"
          : "${WALKMAN_KEY_ALIAS:?Configure the WALKMAN_KEY_ALIAS Actions secret}"
          : "${WALKMAN_KEY_PASSWORD:?Configure the WALKMAN_KEY_PASSWORD Actions secret}"
          umask 077
          export WALKMAN_KEYSTORE_PATH="$RUNNER_TEMP/walkman-release.jks"
          trap 'rm -f "$WALKMAN_KEYSTORE_PATH"' EXIT
          printf '%s' "$WALKMAN_KEYSTORE_BASE64" | base64 --decode > "$WALKMAN_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon
          signature=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs --min-sdk-version 26 app/build/outputs/apk/release/app-release.apk)
          expected=56a574706e4a8452260b27077da58dadcf6781866ff90fc733947e75d12e5530
          [[ "$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$signature")" == "$expected" ]]

      - name: Prepare APK and SHA-256
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SIGN: ${{ steps.prepare.outputs.sign }}
        run: |
          set -euo pipefail
          mkdir dist
          if [[ "$SIGN" == true ]]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Walkman-$VERSION-arm64.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/Walkman-$VERSION-arm64-unsigned.apk"
          fi
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: Walkman-APK
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Walkman-APK
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "v$VERSION" "Walkman-$VERSION-arm64.apk" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
